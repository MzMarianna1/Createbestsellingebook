name: Learning Kingdom V4 landing page QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lk-home-v4-qa.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/lkqa
          cd /tmp/lkqa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test live desktop and phone
        run: |
          mkdir -p qa-artifacts
          node <<'NODE'
          const { chromium } = require('/tmp/lkqa/node_modules/playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const configs = [
              { name: 'desktop', width: 1440, height: 1100 },
              { name: 'phone-375', width: 375, height: 812 }
            ];
            const results = [];

            for (const cfg of configs) {
              const context = await browser.newContext({ viewport: { width: cfg.width, height: cfg.height } });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', err => pageErrors.push(String(err.message || err)));

              await page.goto(`https://www.learningkingdom.education/?lk_v4_qa=${cfg.name}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForSelector('#lk-launch-v4', { state: 'attached', timeout: 45000 });
              await page.waitForTimeout(2500);

              const initial = await page.evaluate(() => {
                const vw = document.documentElement.clientWidth;
                const sw = document.documentElement.scrollWidth;
                const visible = el => {
                  const r = el.getBoundingClientRect();
                  const s = getComputedStyle(el);
                  return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                };
                const overflow = Array.from(document.querySelectorAll('body *'))
                  .filter(visible)
                  .map(el => ({
                    tag: el.tagName,
                    id: el.id || '',
                    cls: typeof el.className === 'string' ? el.className.slice(0,120) : '',
                    left: Math.round(el.getBoundingClientRect().left),
                    right: Math.round(el.getBoundingClientRect().right),
                    width: Math.round(el.getBoundingClientRect().width)
                  }))
                  .filter(x => x.right > vw + 3 || x.left < -3)
                  .slice(0, 20);
                return {
                  viewportWidth: vw,
                  scrollWidth: sw,
                  horizontalOverflow: sw > vw + 3,
                  overflowElements: overflow,
                  h1Count: document.querySelectorAll('#lk-launch-v4 h1').length,
                  heroText: document.querySelector('#lk4-title')?.textContent?.trim() || '',
                  assessmentExists: !!document.querySelector('#lk-assessment form'),
                  programSectionExists: !!document.querySelector('#lk4-programs'),
                  portalLoginExists: !!document.querySelector('#lk-student-login')
                };
              });

              await page.screenshot({ path: `qa-artifacts/${cfg.name}-top.png`, fullPage: false });

              await page.locator('.lk4-assessment-go').first().click();
              await page.waitForTimeout(900);
              const assessmentReachable = await page.evaluate(() => {
                const form = document.querySelector('#lk-assessment form');
                if (!form) return false;
                const r = form.getBoundingClientRect();
                return r.top < window.innerHeight && r.bottom > 0;
              });

              await page.locator('.lk4-program-go').click();
              await page.waitForTimeout(700);
              const programsReachable = await page.evaluate(() => {
                const el = document.querySelector('#lk4-programs');
                if (!el) return false;
                const r = el.getBoundingClientRect();
                return r.top < window.innerHeight && r.bottom > 0;
              });

              const result = { name: cfg.name, ...initial, assessmentReachable, programsReachable, pageErrors };
              results.push(result);
              console.log(JSON.stringify(result));

              if (initial.horizontalOverflow || initial.h1Count !== 1 || !initial.assessmentExists || !initial.programSectionExists || !assessmentReachable || !programsReachable || pageErrors.length) {
                console.error(`QA failed for ${cfg.name}`);
                await context.close();
                await browser.close();
                fs.writeFileSync('qa-artifacts/results.json', JSON.stringify(results, null, 2));
                process.exit(1);
              }
              await context.close();
            }

            fs.writeFileSync('qa-artifacts/results.json', JSON.stringify(results, null, 2));
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lk-home-v4-qa
          path: qa-artifacts/
          if-no-files-found: warn
